[project]
name = "astrbot-plugin-grafana-viewer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
